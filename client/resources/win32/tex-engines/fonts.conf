<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- PaperStudio: fonts visible to sandboxed XeTeX. Installed as install/bin/paperstudio-x64/fonts.conf and pinned;
     the sandbox helper points FONTCONFIG_FILE here. Relative dirs resolve against this file's directory.
     The cache lives under HOME, which the helper sets to the per-compile work directory (discarded afterwards). -->
<fontconfig>
  <dir prefix="relative">../../texmf-dist/fonts/opentype</dir>
  <dir prefix="relative">../../texmf-dist/fonts/truetype</dir>
  <dir>WINDOWSFONTDIR</dir>
  <cachedir>~/.paperstudio-fontconfig</cachedir>
</fontconfig>
